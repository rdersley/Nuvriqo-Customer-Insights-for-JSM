modules:
  jira:globalPage:
    - key: nuvriqo-customer-insights
      resource: main
      resolver:
        function: resolver
      title: Customer Insights
  # Settings (Jira settings → Apps, and "Configure" in Manage apps). Jira
  # admins only; checked again on the server.
  jira:adminPage:
    - key: customer-insights-settings
      title: Customer Insights
      resource: settings
      resolver:
        function: resolver
      useAsConfig: true
  # Published reports for portal customers. Own function (src/portal.js) so
  # customers can't reach the agent resolvers.
  jiraServiceManagement:portalUserMenuAction:
    - key: customer-insights-portal-report
      title: Service report
      resource: portal
      resolver:
        function: portal-resolver
      viewportSize: large
      unlicensedAccess:
        - customer
  function:
    - key: resolver
      handler: index.handler
    - key: portal-resolver
      handler: portal.handler
  # Atlassian-hosted Claude for the opt-in AI summary (src/ai.js).
  llm:
    - key: insights-llm
      model:
        - claude
resources:
  - key: main
    path: static/app/build
  - key: portal
    path: static/portal/build
  - key: settings
    path: static/settings/build
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/58294f6b-c741-495f-a435-0b8f253d5db8
  licensing:
    enabled: true
permissions:
  scopes:
    - read:jira-work
    - read:servicedesk-request
    # GET /rest/servicedeskapi/organization (organisation picker)
    - read:organization:jira-service-management
    # Published portal reports (src/storage.js)
    - storage:app
  content:
    styles:
      - unsafe-inline
