modules:
  jira:globalPage:
    - key: nuvriqo-customer-insights
      resource: main
      resolver:
        function: resolver
      title: Customer Insights
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/app/build
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/58294f6b-c741-495f-a435-0b8f253d5db8
  licensing:
    enabled: true
permissions:
  scopes:
    - read:jira-work
    - read:organization:jira-service-management
  content:
    styles:
      - unsafe-inline
